name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Pin the trusted runner workflow so fork PRs cannot edit its hosted-runner guard.
# Its SHA must also be allowed by the rawtree-ci-provider runner group.
jobs:
  checks:
    uses: rawtreedb/terraform-provider-rawtree/.github/workflows/runner-checks.yml@dad31d599bd42c35fd774a0ceca858e448b2b93a
